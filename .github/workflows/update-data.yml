name: Update league data

# Runs on GitHub's servers (which can reach the score feed) and publishes a
# fresh feed.json to the `data` branch. The Streamlit app reads that branch, so
# it never has to call the feed directly — which is what caused the 403s.

on:
  schedule:
    - cron: "*/10 * * * *"   # every ~10 minutes (GitHub schedules are best-effort)
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches: [main]          # rebuild immediately whenever code changes

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Build feed.json
        run: python build_feed.py

      - name: Publish to data branch (current + per-season archive)
        run: |
          set -e
          cp feed.json "$RUNNER_TEMP/feed.json"
          YEAR=$(python -c "import json;print(json.load(open('feed.json'))['season'])")
          echo "Season year: $YEAR"

          # Preserve existing per-season archives from the data branch.
          mkdir -p "$RUNNER_TEMP/keep"
          if git fetch origin data 2>/dev/null; then
            for f in $(git ls-tree origin/data --name-only | grep -E '^feed-[0-9]+\.json$' || true); do
              git show "origin/data:$f" > "$RUNNER_TEMP/keep/$f" || true
            done
          fi

          # Rebuild the data branch as a single clean commit.
          git config user.name "shpl-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan data-tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP"/keep/*.json . 2>/dev/null || true
          cp "$RUNNER_TEMP/feed.json" feed.json
          cp "$RUNNER_TEMP/feed.json" "feed-$YEAR.json"

          # Season index from whatever archives now exist.
          python - <<'PY'
          import glob, json
          years = sorted({int(fn[5:-5]) for fn in glob.glob("feed-*.json")
                          if fn[5:-5].isdigit()})
          json.dump(years, open("seasons.json", "w"))
          print("seasons.json ->", years)
          PY

          git add -f feed.json seasons.json feed-*.json
          git commit -m "Update league data ($(date -u +%FT%TZ))"
          git branch -M data-tmp data
          git push -f origin data
